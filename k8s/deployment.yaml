apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentimentizer
  labels:
    app: sentimentizer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentimentizer
  template:
    metadata:
      labels:
        app: sentimentizer
    spec:
      # Allow in-flight requests to drain during rolling updates
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
      containers:
        - name: sentimentizer
          image: sentimentizer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            # Sentiment model to load: rnn, encoder, decoder, or modernbert.
            - name: SENTIMENTIZER_DEFAULT_MODEL
              value: "encoder"
            - name: SENTIMENTIZER_EMBEDDINGS_ENABLED
              value: "false"
            - name: SENTIMENTIZER_BGE_M3_ENABLED
              value: "false"
            - name: SENTIMENTIZER_EMBEDDINGS_DEVICE
              value: "cpu"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "8Gi" # BGE-M3 needs ~3 GiB in addition to sentiment/Ray
              cpu: "2000m"
          # Startup probe: generous timeout for cold starts (model download
          # from HF Hub can take minutes). Checked before liveness/readiness.
          startupProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30 # up to 5 minutes
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Allow load balancer to drain connections before SIGTERM
                command: ["sleep", "5"]
