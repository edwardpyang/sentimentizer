[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentimentizer"
version = "0.333.1"
description = "smole language models"
readme = "README.md"
authors = [{ name = "Edward Yang", email = "edwardpyang@gmail.com" }]
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
]
keywords = ["sentiment analysis", "transformers", "deep learning", "encoder-only models", "fine-tuning", "ray"]

dependencies = [
    "numpy>=2.4.0",
    "pandas>=2.2.3",
    "torch>=2.11.0",
    "orjson>=3.11.0",
    "pyarrow>=24.0.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.10.0",
    "torchmetrics>=1.9.0",
    "gensim>=4.4.0",
    "smart_open>=7.6.0",
    "structlog>=25.5.0",
    "psutil>=7.2.0",
    "prometheus_client>=0.25.0",
    "python-dotenv>=1.2.0",
    "pyyaml>=6.0.3",
    # FastAPI 0.139.x adds state that Ray Serve 2.55.1 cannot pickle after
    # its class-based-view transformation in @serve.ingress.
    "fastapi==0.136.1",
    "pydantic-ai-slim[openai]>=1.93.0",
    "langgraph>=1.1.10",
    "rich>=15.0.0",
    "huggingface_hub>=1.14.0",
    "click>=8.3.0",
    "tqdm>=4.67.0",
    "transformers>=4.48.0",
    "bitsandbytes>=0.49.2",
]

[project.optional-dependencies]
ray = [
    "ray[data]>=2.55.1,<2.56.0",
    "ray[serve]>=2.55.1,<2.56.0",
    "ray[train]>=2.55.1,<2.56.0",
    "ray[tune]>=2.55.1,<2.56.0",
    "optuna>=4.8.0",
]
router = [
    "safetensors>=0.4.3",
    "sentence-transformers>=4.0.0",
    "datasets",
    "requests",
]
embeddings = [
    "sentence-transformers>=4.0.0",
    "einops>=0.8.0,<0.9",
    "FlagEmbedding>=1.3.5",
]
onnx = [
    "onnx",
    "onnxruntime",
    "onnxscript",
    # optimum-onnx not included: this project's ONNX needs are met by
    # onnxruntime.quantization.quantize_dynamic directly.
]
dev = [
    "bumpver>=2025.1131",
    "isort>=8.0.0",
    "pip-tools",
    "pyright>=1.1.350",
    "pytest>=9.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.0",
]

[project.scripts]
sentimentizer = "workflows.cli:cli"
web-search = "sentimentizer.agent.websearch:main"

[tool.hatch.build.targets.wheel]
packages = ["sentimentizer", "workflows"]

[dependency-groups]
dev = [
    "bumpver>=2025.1131",
    "isort>=8.0.0",
    "pip-tools",
    "pyright>=1.1.350",
    "pytest>=9.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations (type hints)
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "ANN401",  # Any is acceptable in some cases
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pyright]
include = ["sentimentizer", "workflows"]
exclude = [
    "**/__pycache__",
    ".venv",
    "build",
    "dist"
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportAttributeAccessIssue = "warning"
reportOptionalMemberAccess = "warning"
reportGeneralTypeIssues = "warning"
reportArgumentType = "warning"
reportCallIssue = "warning"
reportPrivateImportUsage = "warning"
reportOperatorIssue = "warning"
reportIndexIssue = "warning"
reportReturnType = "warning"
reportInvalidTypeVarUse = "warning"
reportMissingImports = "warning"


[tool.coverage.run]
source = ["sentimentizer", "workflows"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO.*:FutureWarning",
    "ignore:.*use_push_based_shuffle.*:DeprecationWarning",
    "ignore:.*use_polars.*:DeprecationWarning",
    "ignore:.*use_arrow_tensor_v2.*:DeprecationWarning"
]
