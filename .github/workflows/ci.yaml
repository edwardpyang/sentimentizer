name: ci
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

# Verification only reads repository contents.
permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yaml
