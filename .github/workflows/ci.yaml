name: ci
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  lint-and-test:
    name: lint and test
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      RAY_DISABLE_IMPORT_WARNING: "1"
      RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"
      RAY_DEFAULT_OBJECT_STORE_MEMORY_PROPORTION: "0.5"
      RAY_TQDM: "0"

    steps:

    - uses: actions/checkout@v4

    - name: set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: install dependencies
      run: uv sync --extra dev,diffusion,ray,onnx,router

    - name: ruff lint
      run: uv run ruff check .

    - name: ruff format check
      run: uv run ruff format --check .

    - name: pyright typecheck
      run: uv run pyright

    - name: test with pytest
      run: |
        uv run pytest --exitfirst --verbose --failed-first \
          --cov=sentimentizer --cov=workflows \
          --cov-report=term-missing --cov-report=html

  test-pandas-2:
    # pyproject allows pandas>=2.2.3, but uv.lock pins 3.x, so the job above
    # never exercises 2.x. Install the floor over the lockfile and re-run tests.
    name: test (pandas 2.2.3)
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      RAY_DISABLE_IMPORT_WARNING: "1"
      RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"
      RAY_DEFAULT_OBJECT_STORE_MEMORY_PROPORTION: "0.5"
      RAY_TQDM: "0"

    steps:

    - uses: actions/checkout@v4

    - name: set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: install dependencies
      run: uv sync --extra dev,diffusion,ray,onnx,router

    - name: install pandas 2.2.3 over the lockfile
      run: |
        uv pip install "pandas==2.2.3"
        uv run --no-sync python -c "import pandas; assert pandas.__version__ == '2.2.3', pandas.__version__; print('pandas', pandas.__version__)"

    # --no-sync keeps uv run from restoring the locked pandas 3.x.
    - name: test with pytest
      run: uv run --no-sync pytest --exitfirst --failed-first
