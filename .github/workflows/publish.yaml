name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'

# Jobs request OIDC or repository writes only where required.
permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            if ! git show HEAD~1:pyproject.toml >/dev/null 2>&1; then
              echo "No previous commit or pyproject.toml in HEAD~1"
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
            else
              old_version=$(git show HEAD~1:pyproject.toml | grep '^version =' | cut -d'"' -f2)
              new_version=$(grep '^version =' pyproject.toml | cut -d'"' -f2)
              echo "Old version: $old_version"
              echo "New version: $new_version"
              if [ "$old_version" != "$new_version" ]; then
                echo "should_publish=true" >> "$GITHUB_OUTPUT"
              else
                echo "should_publish=false" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi

  verify:
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    uses: ./.github/workflows/verify.yaml

  publish:
    needs: [check-version, verify]
    if: |
      needs.check-version.outputs.should_publish == 'true' &&
      (github.event_name == 'push' || (github.event_name == 'release' && github.event.release.target_commitish == 'main'))
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: github-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: create version tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_release.py
